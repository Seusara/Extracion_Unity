[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unity-translator"
version = "0.1.0"
description = "Deterministic offline Unity translation pipeline"
requires-python = ">=3.11"
dependencies = ["UnityPy>=1.25,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
unity-translator = "unity_translator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/unity_translator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
